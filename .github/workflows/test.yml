name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1, pinned by commit so a moved tag cannot change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Same command as a local run; the runner's preinstalled Node is enough (no dependencies)
      - run: node engine.test.js
      # Phone layout (390x844): the runner's preinstalled Chrome, still no dependencies
      - run: node layout.test.js
