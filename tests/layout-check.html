<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Layout check</title>
<!-- Loaded by layout.test.js in headless Chrome. Opens the app in a phone-sized frame and renders
     the longest card of every format in every phase; the answer area and the buttons must fit the
     first screen (2026-10-12: chapter chips wrapped one per line and pushed the whole card below it). -->
</head>
<body style="margin:0">
<iframe id="f" src="../index.html" style="width:390px;height:844px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
(async () => {
  const out = document.getElementById("out");
  try {
    const f = document.getElementById("f");
    await new Promise(r => f.complete ? r() : f.addEventListener("load", r));
    await new Promise(r => setTimeout(r, 1500));  // cards.json arrives after load
    const W = f.contentWindow, D = f.contentDocument;
    // Every deck the app lists (DECKS), so a new deck is checked without editing this page (2026-10-14)
    const decks = await Promise.all(Object.values(W.eval("DECKS")).map(d => fetch("../" + d.file).then(r => r.json())));
    const cards = decks.flatMap(d => d.cards);
    const longest = {};
    for (const c of cards) {
      const fmt = W.format(c);
      if (!longest[fmt] || c.q.length > longest[fmt].q.length) longest[fmt] = c;
    }
    // A number card may not exist in the data yet; check the layout with a stand-in.
    if (!longest.num) longest.num = { ...longest.essay, id: "x-num", format: "num", num: { value: 1 } };
    const after = { mc: "result", num: "result", essay: "rubric", flip: "back" };
    const failures = [], seen = [];
    for (const [fmt, c] of Object.entries(longest)) {
      for (const phase of ["front", after[fmt]]) {
        W.eval(`queue = []; phase = ${JSON.stringify(phase)}; typed = "1. x"; picked = "A"; ticks = []; lastScore = 0;`);
        // the app's state lives in top-level let bindings, reachable only through eval
        W.eval(`current = ${JSON.stringify(c)}; render();`);
        const actions = D.getElementById("actions").getBoundingClientRect();
        const work = D.querySelector("#card .work");
        const meta = D.querySelector("#card .meta");
        const where = `${fmt}/${phase} (${c.id})`;
        seen.push(where);
        if (actions.bottom > W.innerHeight) failures.push(`${where}: buttons end at ${Math.round(actions.bottom)}px, screen is ${W.innerHeight}px`);
        if (work && work.getBoundingClientRect().bottom > W.innerHeight) failures.push(`${where}: answer area below the first screen`);
        if (D.documentElement.scrollWidth > W.innerWidth) failures.push(`${where}: page scrolls sideways (${D.documentElement.scrollWidth}px)`);
        // With the page locked (overflow hidden) scrollWidth no longer shows a row that is too wide:
        // check that the menu button and the right-hand action button end inside the screen.
        for (const el of [D.getElementById("openMenu"), D.querySelector("#actions > :last-child"), D.getElementById("today")]) {
          if (el && el.getBoundingClientRect().right > W.innerWidth + 1) failures.push(`${where}: #${el.id || el.className} ends past the right edge`);
        }
        if (meta && meta.scrollHeight > meta.clientHeight + 2) failures.push(`${where}: card tags wrap to a second line`);
        if (phase === "front" && fmt !== "mc" && !work) failures.push(`${where}: no answer area`);
        // 2026-10-13: the page itself must not scroll; only the card's text does
        if (D.documentElement.scrollHeight > W.innerHeight + 1) failures.push(`${where}: page scrolls down (${D.documentElement.scrollHeight}px)`);
      }
    }
    // Swipes: a scroll that the browser takes over ends in pointercancel, often with clientX 0; it
    // used to read as a long left swipe and skip to the next card while the explanation was read.
    const mc = longest.mc, P = (type, x, y) => new W.PointerEvent(type, { bubbles: true, pointerId: 1, clientX: x, clientY: y });
    const body = () => D.querySelector("#card .body");
    W.eval(`queue = [${JSON.stringify(longest.flip)}]; phase = "result"; picked = "A"; lastScore = 0; current = ${JSON.stringify(mc)}; render();`);
    body().dispatchEvent(P("pointerdown", 200, 500)); W.dispatchEvent(P("pointermove", 203, 420)); W.dispatchEvent(P("pointercancel", 0, 0));
    seen.push("swipe/scroll then pointercancel");
    if (W.eval("current && current.id") !== mc.id) failures.push("a vertical scroll ending in pointercancel moved to the next card");
    body().dispatchEvent(P("pointerdown", 200, 500)); W.dispatchEvent(P("pointermove", 260, 380)); W.dispatchEvent(P("pointerup", 320, 300));
    seen.push("swipe/diagonal drag");
    if (W.eval("current && current.id") !== mc.id) failures.push("a mostly vertical drag counted as a swipe");
    body().dispatchEvent(P("pointerdown", 100, 500)); W.dispatchEvent(P("pointermove", 130, 502)); W.dispatchEvent(P("pointermove", 250, 505)); W.dispatchEvent(P("pointerup", 250, 505));
    seen.push("swipe/sideways drag");
    if (W.eval("current && current.id") === mc.id) failures.push("a clear sideways swipe did not move on");
    // The end-of-round screen fits too and says how the round went.
    W.eval(`queue = []; current = null; round = { label: "x", pace: "sched", total: 2, results: [{ id: "a", label: "CH1", right: true, sure: 1 }, { id: "b", label: "CH1", right: false, sure: 1 }], retried: [], ids: [] }; render();`);
    seen.push("round summary");
    if (!/1 \/ 2/.test(D.querySelector("#card").textContent)) failures.push("round summary does not show the score");
    if (D.getElementById("actions").getBoundingClientRect().bottom > W.innerHeight) failures.push("round summary buttons below the screen");
    // Rounds: switching chapters and back resumes the round; 全部刷完 holds every card of the selection,
    // and 全部 under 多章混合 is the sum of the chapters picked; undo takes the result back.
    W.eval(`localStorage.clear(); load(); deckId = "stats";`);
    const chs = [...new Set(W.eval("deck").map(c => c.chapter))].sort();
    const [X, Y] = chs, count = k => W.eval("deck").filter(c => c.chapter === k).length;
    const pick = (fn) => W.eval(`changeSelection(${fn})`);
    pick(`u => { u.pace = "sched"; u.mix = false; u.chapters = [${JSON.stringify(X)}]; }`);
    const total1 = W.eval("round.total"), first = W.eval("current.id");
    W.eval("record(1)");
    pick(`u => { u.chapters = [${JSON.stringify(Y)}]; }`);
    pick(`u => { u.chapters = [${JSON.stringify(X)}]; }`);
    seen.push("rounds/resume after switching chapter");
    if (W.eval("round.total") !== total1 || W.eval("round.results.length") !== 1 || W.eval("round.results[0].id") !== first)
      failures.push("switching chapters and back did not resume the round");
    pick(`u => { u.pace = "all"; }`);
    seen.push("rounds/full pass");
    if (W.eval("round.total") !== count(X)) failures.push(`全部刷完 holds ${W.eval("round.total")} cards, chapter has ${count(X)}`);
    pick(`u => { u.mix = true; u.chapters = [${JSON.stringify(X)}, ${JSON.stringify(Y)}]; }`);
    seen.push("rounds/mixed chapters");
    if (W.eval("round.total") !== count(X) + count(Y)) failures.push("多章混合 does not hold both chapters");
    const before = W.eval("round.results.length"), id = W.eval("current.id");
    W.eval("record(0)"); W.eval("undoLast()");
    seen.push("rounds/undo");
    if (W.eval("round.results.length") !== before || W.eval("current.id") !== id) failures.push("undo did not take the answer back");
    // Mechanical stops (2026-10-13: "本輪 24/24・✓10 ✗14／今天 40 題 48%" and cards kept coming).
    W.eval(`window.ans = ok => { record(ok ? 1 : 0); if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
      current = null; next(); }; localStorage.clear(); load();`);
    pick(`u => { u.pace = "sched"; u.mix = false; u.chapters = [${JSON.stringify(X)}]; u.dailyMax = 300; }`);
    const total = W.eval("round.total");
    for (let i = 0; i < total; i++) W.eval("sure = 0; ans(false)");  // unsure misses go to the end of the round
    seen.push("stop/round ends after every first attempt");
    if (W.eval("current") !== null || !W.eval("round.done")) failures.push(`after ${total}/${total} first attempts the round went on with retries`);
    if (!/繼續複習答錯的（/.test(D.getElementById("actions").textContent)) failures.push("round end offers no 繼續複習答錯的");
    if (!/易錯領域|錯在哪裡/.test(D.querySelector("#card").textContent)) failures.push("round end shows no analysis");
    seen.push("stop/round end shows error rate by domain");
    if (!/錯誤率[\s\S]*長期[\s\S]*嘗試/.test(D.querySelector("#card").textContent)) failures.push("round end shows no error rate and level by domain");
    const table = D.querySelector("#card table.t");
    if (table && table.getBoundingClientRect().right > W.innerWidth + 1) failures.push(`domain table overflows the screen (${Math.round(table.getBoundingClientRect().right)} > ${W.innerWidth})`);
    seen.push("stop/today counts cards, not retries");
    if (!new RegExp(`今天 ${total}/300 張`).test(D.getElementById("today").textContent)) failures.push(`today line: ${D.getElementById("today").textContent}`);
    W.eval("localStorage.clear(); load();");
    pick(`u => { u.pace = "all"; u.chapters = [${JSON.stringify(X)}, ${JSON.stringify(Y)}]; u.mix = true; u.dailyMax = 10; }`);
    for (let i = 0; i < 10; i++) W.eval("ans(true)");
    seen.push("stop/daily limit pauses");
    if (W.eval("typeof paused !== \"undefined\" && paused && paused.code") !== "limit" || W.eval("current") !== null) failures.push("no pause at the daily limit");
    W.eval(`(document.getElementById("goOn") || { click() {} }).click()`);
    if (W.eval("typeof paused === \"undefined\" ? 1 : paused") !== null || W.eval("current") === null) failures.push("再做 20 張 did not continue");
    W.eval("localStorage.clear(); load();");
    pick(`u => { u.dailyMax = 300; }`);
    for (let i = 0; i < 20; i++) W.eval("sure = 1; ans(false)");
    seen.push("stop/a run of misses pauses");
    if (W.eval("typeof paused !== \"undefined\" && paused && paused.code") !== "low") failures.push("no pause after 20 misses in a row");
    seen.push("stop/pause shows error rate by domain");
    if (!/錯誤率/.test(D.querySelector("#card").textContent)) failures.push("pause shows no error rate by domain");
    // Mock exam: no right/wrong shown while it runs, written answers graded after hand-in, score by
    // section at the end, and time-up hands the paper in.
    W.eval("localStorage.clear(); load();");
    pick(`u => { u.pace = "exam"; u.exam = "mid-mini"; }`);
    seen.push("exam/runs without feedback");
    // 2026-10-14: the hidden scope row shifted the grid and the card collapsed to 2px in every exam.
    const cardH = D.getElementById("card").getBoundingClientRect().height;
    if (cardH < 300) failures.push(`exam card collapsed to ${Math.round(cardH)}px high`);
    const n = W.eval("round.total");
    let shown = 0;
    for (let i = 0; i < n * 2 && W.eval("current && !round.exam.grading"); i++) {
      W.eval(`(() => { const f = format(current); if (f === "mc") picked = current.choices[0][0]; else typed = "1"; submit(true); })()`);
      if (W.eval("phase") === "result") shown++;
    }
    if (shown) failures.push(`an answer was marked right/wrong during the exam (${shown} times)`);
    if (!/批改簡答/.test(D.getElementById("roundText").textContent)) failures.push("written answers were not graded after the paper");
    for (let i = 0; i < n && W.eval("current"); i++) W.eval("record(1)");
    seen.push("exam/score by section");
    if (!W.eval("round.done") || !/大題/.test(D.querySelector("#card").textContent)) failures.push("no exam summary with sections");
    if (!/再考一次/.test(D.getElementById("actions").textContent)) failures.push("exam end offers no 再考一次");
    W.eval(`document.getElementById("again").click()`);
    W.eval("round.exam.ends = Date.now() - 1; examTick()");
    seen.push("exam/time-up hands in");
    if (!W.eval("round.exam.timeUp") || W.eval("current && !round.exam.grading")) failures.push("time-up did not hand the paper in");
    W.eval("clearInterval(examTicker); localStorage.clear(); load();");
    pick(`u => { u.pace = "sched"; u.mix = false; u.chapters = [${JSON.stringify(X)}]; }`);
    W.eval("record(1)"); W.eval("renderScores()");
    seen.push("menu/scores");
    if (!D.querySelector("#scores table") || !/已作答 1\//.test(D.getElementById("scores").textContent)) failures.push("menu scores do not show this round");
    // Anonymous sharing against a stub endpoint: asked once at a round's end, nothing queued before
    // the answer, a joined attempt queued without time of day or text, undo takes it back, the round's
    // end sends it and an accepted reply empties the queue.
    W.eval(`localStorage.clear(); load(); SHARE_URL = "stub://share";
      window.sent = []; window.realFetch = window.fetch; window.fetch = async (u, o) => { sent.push(JSON.parse(o.body)); return { json: async () => ({ ok: true }) }; };`);
    pick(`u => { u.pace = "sched"; u.mix = false; u.chapters = [${JSON.stringify(X)}]; u.dailyMax = 300; }`);
    W.eval("ans(true)");
    seen.push("share/nothing queued before joining");
    if (W.eval("shareQueue().length")) failures.push("an attempt was queued before the learner joined");
    for (let i = 0; i < 40 && W.eval("current"); i++) W.eval("ans(true)");
    seen.push("share/asked once at the round's end");
    if (!/要匿名回傳作答嗎/.test(D.querySelector("#card").textContent)) failures.push("no sharing question at the round's end");
    W.eval(`document.querySelector('#card [data-share="1"]').click()`);
    if (/要匿名回傳作答嗎/.test(D.querySelector("#card").textContent) || !W.eval("share().on")) failures.push("joining did not take or the question stayed");
    W.eval(`document.getElementById("again").click()`);
    W.eval("record(1)");
    seen.push("share/joined attempt queued without time or text");
    const queued = W.eval("shareQueue()[0]");
    if (!queued || !/^\d{4}-\d{2}-\d{2}$/.test(queued.day) || Object.keys(queued).length !== 11) failures.push(`queued row: ${JSON.stringify(queued)}`);
    W.eval("undoLast()");
    seen.push("share/undo takes the row back");
    if (W.eval("shareQueue().length")) failures.push("undo left the shared row queued");
    W.eval("record(0)");
    await W.eval("flushShare()");
    seen.push("share/sent and cleared");
    if (W.eval("shareQueue().length") || !W.eval("sent.length")) failures.push("queued row was not sent and cleared");
    W.eval(`SHARE_URL = ""; window.fetch = realFetch; localStorage.clear(); load();`);
    // Research deck: a scope must not hide the other groups (2026-10-14: 本學期 hid 質性 and 工具), and
    // every mock exam fills its sections from the deck as exported.
    await W.eval(`openDeck("research")`);
    W.eval("localStorage.clear(); load();");
    pick(`u => { u.pace = "sched"; u.scope = "sem1"; u.group = "all"; u.chapters = []; }`);
    seen.push("groups/listed under a scope");
    const row = D.getElementById("scopes").textContent;
    for (const g of ["量化", "質性", "通論", "工具"]) if (!row.includes(g)) failures.push(`group ${g} missing under 本學期: ${row}`);
    W.eval(`(document.querySelector('#scopes [data-f="g:質性"]') || { click() {} }).click()`);
    if (W.eval("ui().scope") !== "all" || !W.eval("allCards().filter(inSelection).length")) failures.push("picking 質性 under 本學期 left no cards");
    for (const deckName of Object.keys(W.eval("DECKS"))) {
      await W.eval(`openDeck(${JSON.stringify(deckName)})`);
      // every deck names its sources in the menu (出處與著作權, 2026-10-14)
      seen.push(`sources/${deckName} listed`);
      if (!D.querySelectorAll("#deckSources li b").length) failures.push(`${deckName}: no sources listed under 出處與著作權`);
      // exam progress in its three data states (改善規劃.md stage A acceptance): no records, cached records
      // with three 危險 rounds in a row, and records imported from a file with nothing in the last 7 days.
      if (Object.keys(W.eval("voices")).length && W.eval("!!progressScope()")) {
        const ids = W.eval("allCards().filter(c => scopeHas(progressScope(), c)).slice(0, 2).map(c => c.id)"), now = Date.now();
        const states = {
          none: { progress: {}, history: [], imported: false, want: ["暫不判斷危機度", "虛構評語"] },
          cached: { progress: { [ids[0]]: { box: 1, due: now, log: [[now, 0, 0]] } },
            history: [1, 2, 3].map(i => ({ t: now - i, label: "x", n: 1, right: 0, sureWrong: 0, tier: "危險" })), imported: false,
            want: ["危機：危險", "連續 3 輪", "虛構評語"] },
          imported: { progress: { [ids[0]]: { box: 1, due: now, log: [[now - 30 * 864e5, 1, 0]] } }, history: [], imported: true,
            want: ["全部紀錄的平均速度", "依匯入的成績計算"] },
        };
        for (const [name, s] of Object.entries(states)) {
          seen.push(`progress/${deckName} ${name}`);
          W.eval(`localStorage.clear(); load(); state.progress = ${JSON.stringify(s.progress)}; state.history = ${JSON.stringify(s.history)};
            importedNote = ${s.imported}; queue = []; current = null;
            round = { label: "x", pace: "sched", total: 2, results: ${JSON.stringify(ids.map(id => ({ id, label: "x", right: false, sure: 0 })))}, retried: [], ids: [] }; render();`);
          // Measure the settled layout. render() clears the swipe transform with a CSS transition, so on CI
          // the first deck was measured while the card was still rotating back from the earlier swipe
          // check: fragments shrank and drifted upward and a two-line summary counted as four (2026-10-15).
          // getAnimations() did not see a transition that had not started yet, so switch it off instead.
          W.eval("clearTimeout(advanceTimer)");
          const card = D.getElementById("card"); card.style.transition = "none"; void card.offsetWidth;
          await D.fonts.ready;
          const box = D.querySelector(".progress-box"), text = box ? box.textContent : "";
          for (const w of s.want) if (!text.includes(w)) failures.push(`${deckName} ${name}: progress box lacks "${w}": ${text.slice(0, 160)}`);
          const img = box && box.querySelector(".voice img");
          if (!img) { failures.push(`${deckName} ${name}: no portrait`); continue; }
          await new Promise(r => img.complete ? r() : (img.onload = img.onerror = r));
          if (!img.naturalWidth) failures.push(`${deckName} ${name}: portrait ${img.getAttribute("src")} did not load`);
          if (!box.querySelector(".voice .quote")) failures.push(`${deckName} ${name}: no sourced quote`);
          // Count the lines the text actually breaks into (the text fragments' vertical positions), not
          // height / line height: on CI a fallback font made a two-line box 3.5 "lines" tall (2026-10-15).
          const line = box.querySelector(".prog-line"), range = D.createRange();
          range.selectNodeContents(line);
          const mids = [...range.getClientRects()].filter(x => x.width > 0).map(x => (x.top + x.bottom) / 2).sort((a, b) => a - b);
          const lines = [];
          for (const m of mids) {
            const last = lines[lines.length - 1];
            if (last && m - last.mid < 8) last.n++; else lines.push({ mid: m, n: 1 });
          }
          const cs = W.getComputedStyle(line), info = `${lines.length} lines, ${Math.round(line.getBoundingClientRect().width)}px wide, font ${cs.fontSize} ${cs.fontFamily}, word-break ${cs.wordBreak}, lang ${line.closest("[lang]") ? line.closest("[lang]").lang : "-"}, fragments ${[...range.getClientRects()].filter(x => x.width > 0).map(x => Math.round(x.top) + ":" + Math.round(x.width)).join(" ")}`;
          if (lines.length > 2) failures.push(`${deckName} ${name}: summary line breaks into ${info}: ${line.textContent}`);
          if (box.getBoundingClientRect().right > W.innerWidth + 0.5) failures.push(`${deckName} ${name}: progress box wider than the screen`);
        }
      }
      for (const ex of W.eval("exams")) {
        seen.push(`exam/${deckName} ${ex.id} fills`);
        const b = W.Engine.buildExam(W.eval("allCards()"), ex);
        if (b.short.length) failures.push(`${deckName} ${ex.id}: sections short ${b.short.join("、")}`);
      }
    }
    W.localStorage.clear();
    // Nothing the app loads or sends may be blocked by its own Content-Security-Policy (2026-10-16)
    const csp = W.__csp || ["violation log missing: the test server did not inject it"];
    if (csp.length) failures.push(`CSP blocked: ${csp.join("; ")}`);
    else seen.push("csp: no violations");
    out.textContent = JSON.stringify({ seen, failures });
  } catch (e) {
    out.textContent = JSON.stringify({ seen: [], failures: [`check crashed: ${e}`] });
  }
})();
</script>
</body>
</html>
